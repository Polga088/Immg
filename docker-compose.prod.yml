services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: immg-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: immg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: immg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - immg-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immg -d immg"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: immg-ollama-prod
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - immg-internal
    deploy:
      resources:
        limits:
          memory: 8G

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: immg-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://immg:${POSTGRES_PASSWORD}@postgres:5432/immg
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_ROUTER_MODEL: ${OLLAMA_ROUTER_MODEL:-llama3.2:3b}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      INGEST_SECRET: ${INGEST_SECRET:-}
      IRCC_LIVE_FETCH: ${IRCC_LIVE_FETCH:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - immg-internal

  nginx:
    image: nginx:alpine
    container_name: immg-nginx-prod
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ${NGINX_CONF_PATH:-./deploy/nginx/immg-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - immg-internal

  certbot:
    image: certbot/certbot:latest
    container_name: immg-certbot-prod
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $$!; done"
    networks:
      - immg-internal

volumes:
  postgres_data:
  ollama_data:
  certbot_www:
  certbot_certs:

networks:
  immg-internal:
    driver: bridge
