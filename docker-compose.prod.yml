services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: immg-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: immg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: immg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - immg-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immg -d immg"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: immg-ollama-prod
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - immg-internal
    deploy:
      resources:
        limits:
          memory: 8G

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: immg-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://immg:${POSTGRES_PASSWORD}@postgres:5432/immg
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - immg-internal

  nginx:
    image: nginx:alpine
    container_name: immg-nginx-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/immg.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - immg-internal

volumes:
  postgres_data:
  ollama_data:

networks:
  immg-internal:
    driver: bridge
