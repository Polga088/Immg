services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: immg-postgres
    environment:
      POSTGRES_USER: immg
      POSTGRES_PASSWORD: immg_dev
      POSTGRES_DB: immg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immg -d immg"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: immg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama-docker

volumes:
  postgres_data:
  ollama_data:
